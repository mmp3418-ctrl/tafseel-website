<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1c1a16"/>
      <stop offset="100%" stop-color="#0d0d0d"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d8eef8" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#7aa0b8" stop-opacity="0.18"/>
    </linearGradient>
    <linearGradient id="alum" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4a4a4a"/>
      <stop offset="50%" stop-color="#2a2a2a"/>
      <stop offset="100%" stop-color="#1a1a1a"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="900" fill="url(#bg)"/>
  <rect x="260" y="70" width="680" height="50" rx="4" fill="url(#alum)"/>
  <rect x="280" y="88" width="640" height="10" rx="2" fill="#D4AF37" opacity="0.7"/>
  <!-- thick aluminum outer frame -->
  <rect x="260" y="130" width="680" height="640" rx="4" fill="url(#alum)"/>
  <!-- wide glass panels -->
  <rect x="290" y="160" width="620" height="175" rx="3" fill="url(#glass)" stroke="#D4AF37" stroke-width="8" stroke-opacity="0.45"/>
  <rect x="290" y="360" width="620" height="175" rx="3" fill="url(#glass)" stroke="#D4AF37" stroke-width="8" stroke-opacity="0.45"/>
  <rect x="290" y="560" width="620" height="175" rx="3" fill="url(#glass)" stroke="#D4AF37" stroke-width="8" stroke-opacity="0.45"/>
  <!-- structural bars -->
  <rect x="260" y="345" width="680" height="18" fill="url(#alum)"/>
  <rect x="260" y="545" width="680" height="18" fill="url(#alum)"/>
  <rect x="260" y="770" width="680" height="28" fill="url(#alum)"/>
</svg>
